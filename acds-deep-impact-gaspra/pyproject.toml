[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "deepimpact"
description = "Asteroid atmospheric entry solver"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.2",
    "scipy>=1.16.1",
    "sympy",
    "pandas>=3.0",
    "matplotlib>=3.10.5",
    "pytest",
    "pytest-timeout",
    "sphinx",
    "dask",
    "distributed",
    "gdown",
    "folium",
    "flake8"
]

[tool.setuptools]
packages = ["deepimpact"]