[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mycoolproject"
version = "0.0.0"
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["sample", "development"]
authors = [{ name = "Simon Warder", email = "s.warder15@imperial.ac.uk" }]

maintainers = [
  { name = "Simon Warder", email = "s.warder15@imperial.ac.uk" },
]

classifiers = [
  "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.26.4"
]

[tool.setuptools]
packages = ["mycoolproject"]