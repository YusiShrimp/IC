# Testing libraries (nbval, flake8, and flake8-nb)
# are not considered dependencies. They are pip-installed
# separately on CI.

name: npp2026
channels:
  - conda-forge
dependencies:
  - pip
  - python=3.14  # Should test up to 3.15
  - jupyter
  - numpy
  - matplotlib
  - scipy
  - sympy
  - jupyterlab_rise
  - pip:
     - -r requirements.txt
