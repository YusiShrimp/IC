name: tests

on: [push]

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pandas

      - name: Test with pytest
        run: pytest -v --tb=line --assert=plain .github/test_submission.py